<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全登录 · ProxyPoolHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <header class="login-header">
      <div class="login-logo-wrap"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
      <div><h1 class="login-title">ProxyPoolHub</h1><p class="login-subtitle">管理登录</p></div>
    </header>
    <form id="loginForm" class="login-form" method="post" action="/login">
      <div class="form-group">
        <label for="username">管理账号</label>
        <div class="input-wrap"><input id="username" name="username" value="{{DEFAULT_USER}}" required autocomplete="username" maxlength="128"></div>
      </div>
      <div id="passwordSection" class="form-group">
        <label for="password">管理密码</label>
        <div class="input-wrap password-wrap"><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="256" autofocus><button id="toggleLoginPassword" class="btn-toggle-pwd" type="button" aria-label="显示密码">显示</button></div>
      </div>
      <div id="totpSection" class="form-group" style="display: none;">
        <label for="totpCode">Google 动态验证码</label>
        <div class="input-wrap"><input id="totpCode" name="totpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></div>
      </div>
      <div class="form-options"><label class="checkbox-label"><input type="checkbox" name="remember" value="true"><span>保持登录状态（7 天）</span></label></div>
      <div id="errorAlert" class="login-error" role="alert" style="{{ERROR_STYLE}}">{{ERROR}}</div>
      <button id="submitBtn" class="button primary btn-login" type="submit">登录</button>
    </form>
  </main>
  <script>
    const isTotpConfigured = "{{TOTP_CONFIGURED}}" === "true";
    document.querySelector('#totpSection').style.display = isTotpConfigured ? 'flex' : 'none';
    document.querySelector('#totpCode').required = isTotpConfigured;
    document.querySelector('#totpCode').disabled = !isTotpConfigured;
    document.querySelector('#toggleLoginPassword').addEventListener('click', (event) => {
      const input = document.querySelector('#password');
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      event.currentTarget.textContent = visible ? '隐藏' : '显示';
      event.currentTarget.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
    });
    document.querySelector('#loginForm').addEventListener('submit', () => {
      document.querySelector('#submitBtn').disabled = true;
    });
  </script>
</body>
</html>
